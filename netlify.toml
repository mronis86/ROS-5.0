# Netlify configuration - repository root (for Git-triggered deploys)
# For UPLOAD deploy: upload netlify-YYYY-MM-DD-V2 folder; that has its own netlify.toml
# Config bump: 2026-09-21 — app traffic redirects to Cloudflare Pages; zip downloads stay here.

[build]
  ignore = "exit 1"
  command = "bash netlify/build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.20.0"
  NPM_VERSION = "10"
  NPM_FLAGS = "--prefer-offline=false"
  CI = "true"

# Serve zip downloads on Netlify (Cloudflare large zips 302 here — must not redirect these)
[[redirects]]
  from = "/companion-module-runofshow.zip"
  to = "/companion-module-runofshow.zip"
  status = 200
  force = true

[[redirects]]
  from = "/companion-module-runofshow-full.zip"
  to = "/companion-module-runofshow-full.zip"
  status = 200
  force = true

[[redirects]]
  from = "/companion-module-runofshow-resolume-full.zip"
  to = "/companion-module-runofshow-resolume-full.zip"
  status = 200
  force = true

[[redirects]]
  from = "/companion-module-runofshow-mitti-full.zip"
  to = "/companion-module-runofshow-mitti-full.zip"
  status = 200
  force = true

[[redirects]]
  from = "/offline-show.zip"
  to = "/offline-show.zip"
  status = 200
  force = true

[[redirects]]
  from = "/ros-osc-python-app.zip"
  to = "/ros-osc-python-app.zip"
  status = 200
  force = true

[[redirects]]
  from = "/ROS-OSC-Control-portable.zip"
  to = "/ROS-OSC-Control-portable.zip"
  status = 200
  force = true

[[redirects]]
  from = "/electron-osc-app.zip"
  to = "/electron-osc-app.zip"
  status = 200
  force = true

[[redirects]]
  from = "/ros-led-spout.zip"
  to = "/ros-led-spout.zip"
  status = 200
  force = true

[[redirects]]
  from = "/ros-vmix-datasource-bridge.zip"
  to = "/ros-vmix-datasource-bridge.zip"
  status = 200
  force = true

[[redirects]]
  from = "/ros-hyperdeck-ingest.zip"
  to = "/ros-hyperdeck-ingest.zip"
  status = 200
  force = true

# App + all other routes → Cloudflare Pages (preserve path)
[[redirects]]
  from = "/*"
  to = "https://ros1615.pages.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
