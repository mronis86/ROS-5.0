<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Run of Show Schedule</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        color: #e2e8f0;
      }
      html {
        background-color: #0f172a;
      }
      body {
        background-color: #0f172a;
      }
      html.led-output-broadcast,
      html.led-output-broadcast body {
        background-color: transparent;
      }
      #root {
        min-height: 100%;
      }
    </style>
    <script>
      (function () {
        if (window.location.pathname === '/led-output') {
          document.documentElement.classList.add('led-output-broadcast');
          document.documentElement.style.backgroundColor = 'transparent';
          document.body.style.backgroundColor = 'transparent';
          var root = document.getElementById('root');
          if (root) root.style.backgroundColor = 'transparent';
        }
        // Green Room display client: seed API token before React mounts, then strip from URL.
        try {
          var hashRaw = (window.location.hash || '').replace(/^#/, '');
          var hashParams = new URLSearchParams(hashRaw);
          var searchParams = new URLSearchParams(window.location.search || '');
          var raw = (
            searchParams.get('apiToken') ||
            searchParams.get('ros_api_token') ||
            hashParams.get('ros_api_token') ||
            hashParams.get('token') ||
            ''
          ).trim();
          if (raw && /^(ros_itok_|ros_nsess_|ros_sess_)/.test(raw)) {
            localStorage.setItem('ros_api_token', raw);
            searchParams.delete('apiToken');
            searchParams.delete('ros_api_token');
            hashParams.delete('ros_api_token');
            hashParams.delete('token');
            var nextSearch = searchParams.toString();
            var nextHash = hashParams.toString();
            var next =
              window.location.pathname +
              (nextSearch ? '?' + nextSearch : '') +
              (nextHash ? '#' + nextHash : '');
            window.history.replaceState(null, '', next);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
